<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Soleia</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <meta name="description" content="Soleia Creative Management System">
    <meta name="author" content="Soleia" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" type="image/x-icon" />
    <link rel="icon" href="/soleia-icon-192.png" type="image/png" sizes="192x192" />
    <!-- iOS takes the home-screen icon from here, not the manifest: 180x180,
         opaque (iOS paints a transparent corner black and rounds it itself). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Both spellings: iOS reads the apple- one, and Chrome warns that it is
         deprecated in favour of the plain one. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The page draws under the status bar; the safe-area scrim in index.css
         paints that band charcoal, so the white clock always reads. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Soleia" />
    <!-- One manifest only. A second link here pointed at public/manifest.json,
         which browsers read first and which still called the app "Soleia Looks
         Collection"; the one vite-plugin-pwa generates is the real thing. -->
    <!-- The band the OS paints around an installed window. Charcoal, not gold. -->
    <meta name="theme-color" content="#1D2027" />

    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/soleia-icon.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Soleia" />
    <meta name="twitter:image" content="/soleia-icon.png" />
    
  
  
  
  <meta property="og:title" content="Soleia">
  <meta name="twitter:title" content="Soleia">
  <meta property="og:description" content="Soleia Creative Management System">
  <meta name="twitter:description" content="Soleia Creative Management System">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
