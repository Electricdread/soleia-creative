[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The guide gets typed without its hyphen. Send that spelling to the real
# route, sub-path and all, before the SPA fallback below can swallow it.
# (public/_redirects carries the same rule: that file is applied first.)
[[redirects]]
  from = "/creativeguide"
  to = "/creative-guide"
  status = 301

[[redirects]]
  from = "/creativeguide/*"
  to = "/creative-guide/:splat"
  status = 301

# SPA fallback — every non-file path must serve index.html so client-side
# routes resolve. This is what keeps live client links such as
# /proposal/:token and /packet/:token working.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media and guide assets: cache but allow revalidation so replacing an image
# does not strand viewers on a stale copy.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/creative-guide/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# The service worker must never be cached, or clients pin an old app shell.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
